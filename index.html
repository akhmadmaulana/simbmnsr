    // =========================================================================

    // =========================================================================
    // HELPER FUNCTIONS
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndonesia(dateObj = new Date()) {
      const bulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = bulan[dateObj.getMonth()];
      const y = dateObj.getFullYear();
      return `${d} ${m} ${y}`;
    }

    function formatTimestampSekarang() {
      const now = new Date();
      const tgl = formatTanggalIndonesia(now);
      const jam = String(now.getHours()).padStart(2, '0');
      const mnt = String(now.getMinutes()).padStart(2, '0');
      return `${tgl}, ${jam}:${mnt} WIB`;
    }

    let toastTimer = null;
    function showToast(message, type = 'success') {
      state.toast = { message, type };
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = null;
        render();
      }, 3500);
    }

    function triggerPrintLabels() {
      const paperSize = (state.modal && state.modal.paperSize) || 'A4';
      const pageStyleEl = document.getElementById('dynamic-print-page-style');
      if (pageStyleEl) {
        pageStyleEl.textContent = paperSize === 'Legal'
          ? '@media print { @page { size: 216mm 330mm portrait; margin: 10mm; } }'
          : '@media print { @page { size: A4 portrait; margin: 10mm; } }';
      }

      document.body.classList.add('printing-labels');
      window.print();
      setTimeout(() => {
        document.body.classList.remove('printing-labels');
      }, 500);
    }

    // =========================================================================

        {

    // =========================================================================
    // SINKRONISASI FIRESTORE REAL-TIME (SAAT IS_PREVIEW === false)
    // =========================================================================
    function detachListeners() {
      state.unsubscribers.forEach(unsub => {
        try { unsub(); } catch (e) {}
      });
      state.unsubscribers = [];
    }

    function attachFirestoreListeners() {
      if (IS_PREVIEW || !db) return;
      detachListeners();

      // 1. Identitas Sekolah
      const unsubIdentitas = onSnapshot(doc(db, 'settings', 'identitas'), (snap) => {
        if (snap.exists()) {
          state.identitas = { ...state.identitas, ...snap.data() };
          render();
        }
      });
      state.unsubscribers.push(unsubIdentitas);

      // 2. Koleksi Master & Transaksi
      const collections = ['barang', 'pinjaman', 'ruangan', 'sumber', 'users'];
      collections.forEach(colName => {
        const unsub = onSnapshot(collection(db, colName), (snap) => {
          state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          render();
        });
        state.unsubscribers.push(unsub);
      });

      // 3. Log Aktivitas
      const qLogs = query(collection(db, 'logs'), orderBy('createdAt', 'desc'), limit(25));
      const unsubLogs = onSnapshot(qLogs, (snap) => {
        state.logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });
      state.unsubscribers.push(unsubLogs);
    }

    async function recordActivityLog(aktivitas) {
      const userName = state.currentUser ? state.currentUser.name : 'Sistem';
      const entry = {
        aktivitas,
        user: userName,
        timestamp: formatTimestampSekarang()
      };

      if (IS_PREVIEW) {
        state.logs.unshift({ id: 'log-' + Date.now(), ...entry });
        return;
      }

      if (db) {
        try {
          await addDoc(collection(db, 'logs'), {
            ...entry,
            createdAt: serverTimestamp()
          });
        } catch (err) {
          console.error('Gagal mencatat log:', err);
        }
      }
    }

    // =========================================================================
    // AUTENTIKASI HYBRID (ADMIN VIA FIREBASE AUTH, USER VIA FIRESTORE)
    // =========================================================================
    async function handleLoginAdmin(email, password) {
      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          if (email === 'admin@sekolah.sch.id' && password === 'admin123') {
            initPreviewData();
            state.currentUser = {
              id: 'admin-demo',
              name: 'Rudi Dowa (Admin)',
              role: 'admin',
              emailOrUsername: email
            };
            await recordActivityLog('Login Berhasil (Administrator)');
            showToast('Selamat datang kembali, Administrator!');
          } else {
            showToast('Email atau password demo salah! Gunakan admin@sekolah.sch.id / admin123', 'error');
          }
        } else {
          if (!auth) throw new Error('Firebase Auth belum terkonfigurasi.');
          const cred = await signInWithEmailAndPassword(auth, email, password);
          state.currentUser = {
            id: cred.user.uid,
            name: cred.user.displayName || email.split('@')[0],
            role: 'admin',
            emailOrUsername: cred.user.email
          };
          attachFirestoreListeners();
          await recordActivityLog(`Login Admin (${cred.user.email})`);
          showToast('Berhasil masuk sebagai Administrator!');
        }
      } catch (err) {
        console.error('Login Admin Error:', err);
        showToast('Login gagal: Periksa kembali email & password Admin Anda.', 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleLoginUser(username, password) {
      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          initPreviewData();
          const found = state.users.find(u => u.username === username && u.password === password);
          if (found) {
            state.currentUser = {
              id: found.id,
              name: found.namaLengkap,
              role: 'user',
              emailOrUsername: found.username
            };
            await recordActivityLog(`Login Petugas (${found.namaLengkap})`);
            showToast(`Selamat datang, ${found.namaLengkap}!`);
          } else {
            showToast('Username atau password petugas demo salah! Gunakan petugas1 / 123', 'error');
          }
        } else {
          if (!db) throw new Error('Firestore belum terkonfigurasi.');
          const qUser = query(
            collection(db, 'users'),
            where('username', '==', username.trim()),
            where('password', '==', password)
          );
          const snap = await getDocs(qUser);
          if (!snap.empty) {
            const docSnap = snap.docs[0];
            const userData = docSnap.data();
            state.currentUser = {
              id: docSnap.id,
              name: userData.namaLengkap || username,
              role: 'user',
              emailOrUsername: userData.username
            };
            attachFirestoreListeners();
            await recordActivityLog(`Login Petugas (${state.currentUser.name})`);
            showToast(`Selamat datang, ${state.currentUser.name}!`);
          } else {
            showToast('Akun petugas tidak ditemukan atau password salah.', 'error');
          }
        }
      } catch (err) {
        console.error('Login User Error:', err);
        showToast('Terjadi kesalahan saat memverifikasi akun petugas.', 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleLogout() {
      if (!IS_PREVIEW && auth && state.currentUser?.role === 'admin') {
        try { await signOut(auth); } catch (e) {}
      }
      detachListeners();
      state.currentUser = null;
      state.activeMenu = 'dashboard';
      state.modal = null;
      render();
      showToast('Anda telah keluar dari sistem.', 'info');
    }

    // =========================================================================
    // OPERASI CRUD (DUAL-MODE: IN-MEMORY PREVIEW & FIRESTORE PRODUKSI)
    // =========================================================================
    async function saveData(colName, payload, docId = null) {
      try {
        if (colName === 'identitas') {
          if (IS_PREVIEW) {
            state.identitas = { ...state.identitas, ...payload };
          } else if (db) {
            await setDoc(doc(db, 'settings', 'identitas'), payload, { merge: true });
          }
          await recordActivityLog('Memperbarui Identitas Pendidikan');
          showToast('Identitas pendidikan berhasil disimpan!');
          render();
          return;
        }

        if (IS_PREVIEW) {
          if (docId) {
            const idx = state[colName].findIndex(i => i.id === docId);
            if (idx !== -1) state[colName][idx] = { ...state[colName][idx], ...payload };
            await recordActivityLog(`Memperbarui data ${colName}`);
            showToast('Data berhasil diperbarui!');
          } else {
            state[colName].unshift({ id: colName[0] + '-' + Date.now(), ...payload });
            await recordActivityLog(`Menambahkan data ${colName} baru`);
            showToast('Data baru berhasil ditambahkan!');
          }
        } else if (db) {
          if (docId) {
            await updateDoc(doc(db, colName, docId), { ...payload, updatedAt: serverTimestamp() });
            await recordActivityLog(`Memperbarui data ${colName}`);
            showToast('Data berhasil diperbarui ke Firestore!');
          } else {
            await addDoc(collection(db, colName), { ...payload, createdAt: serverTimestamp() });
            await recordActivityLog(`Menambahkan data ${colName} baru`);
            showToast('Data berhasil disimpan ke Firestore!');
          }
        }

        state.modal = null;
        render();
      } catch (err) {
        console.error('Save Error:', err);
        showToast('Gagal menyimpan data: ' + err.message, 'error');
      }
    }

    async function deleteData(colName, docId, label = '') {
      try {
        if (IS_PREVIEW) {
          state[colName] = state[colName].filter(i => i.id !== docId);
        } else if (db) {
          await deleteDoc(doc(db, colName, docId));
        }
        await recordActivityLog(`Menghapus ${colName}: ${label}`);

        showToast('Data berhasil dihapus!');
        render();
      } catch (err) {
        console.error('Delete Error:', err);
        showToast('Gagal menghapus data: ' + err.message, 'error');
      }
    }

    async function handleImportExcelFile(file, modul) {
      if (!file || typeof XLSX === 'undefined') return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!rows || rows.length === 0) {
            showToast('File Excel kosong atau format tidak terbaca.', 'error');
            return;
          }

          let importedCount = 0;

          if (modul === 'barang') {
            for (const r of rows) {
              const namaBarang = r['Nama Barang'] || r['namaBarang'];
              if (!namaBarang) continue;

              const namaRuangInput = String(r['Ruangan'] || r['namaRuangan'] || '').trim();
              const matchedRuang = state.ruangan.find(rm => rm.namaRuang.toLowerCase() === namaRuangInput.toLowerCase());

              const namaSumberInput = String(r['Sumber Barang'] || r['Sumber'] || r['namaSumber'] || '').trim();
              const matchedSumber = state.sumber.find(sm => sm.namaSumber.toLowerCase() === namaSumberInput.toLowerCase());

              const linkBast = String(r['Link BAST'] || r['Link / Bukti BAST'] || r['bastUrl'] || '').trim();

              const payload = {
                kodeBarang: String(r['Kode Barang'] || r['kodeBarang'] || `INV-${Date.now().toString().slice(-4)}`),
                namaBarang: String(namaBarang),
                ruanganId: matchedRuang ? matchedRuang.id : '',
                namaRuangan: matchedRuang ? matchedRuang.namaRuang : (namaRuangInput || '-'),
                sumberId: matchedSumber ? matchedSumber.id : '',
                namaSumber: matchedSumber ? matchedSumber.namaSumber : (namaSumberInput || '-'),
                jumlah: Number(r['Jumlah'] || r['jumlah']) || 1,
                kondisi: ['Baik', 'Rusak Ringan', 'Rusak Menengah', 'Rusak Berat'].includes(r['Kondisi']) ? r['Kondisi'] : 'Baik',
                tahunPerolehan: String(r['Tahun Perolehan'] || r['tahunPerolehan'] || new Date().getFullYear()),
                bastUrl: linkBast !== '-' ? linkBast : '',
                bastNama: linkBast && linkBast !== '-' ? 'Dokumen BAST (Import)' : '',
                keterangan: String(r['Keterangan'] || r['keterangan'] || '')
              };

              if (IS_PREVIEW) {
                state.barang.unshift({ id: 'b-' + Date.now() + '-' + importedCount, ...payload });
              } else if (db) {
                await addDoc(collection(db, 'barang'), { ...payload, createdAt: serverTimestamp() });
              }
              importedCount++;
            }
            await recordActivityLog(`Import Excel: ${importedCount} data barang ditambahkan`);
          } else if (modul === 'pinjaman') {
            for (const r of rows) {
              const peminjam = r['Peminjam / Unit'] || r['Peminjam'] || r['peminjam'];
              const namaBarangInput = String(r['Nama Barang'] || r['Barang Dipinjam'] || r['namaBarang'] || '').trim();
              if (!peminjam || !namaBarangInput) continue;

              const matchedBarang = state.barang.find(b => b.namaBarang.toLowerCase() === namaBarangInput.toLowerCase());

              const payload = {
                kodePinjam: String(r['Kode Pinjam'] || r['kodePinjam'] || `PJM-${Date.now().toString().slice(-4)}`),
                peminjam: String(peminjam),
                barangId: matchedBarang ? matchedBarang.id : '',
                namaBarang: matchedBarang ? matchedBarang.namaBarang : namaBarangInput,
                jumlah: Number(r['Jumlah'] || r['jumlah']) || 1,
                tglPinjam: String(r['Tanggal Pinjam'] || r['Tgl Pinjam'] || new Date().toISOString().slice(0, 10)),
                tglKembali: String(r['Tanggal Kembali'] || r['Tgl Kembali'] || ''),
                status: r['Status'] === 'Dikembalikan' ? 'Dikembalikan' : 'Dipinjam',
                catatan: String(r['Catatan'] || r['catatan'] || '')
              };

              if (IS_PREVIEW) {
                state.pinjaman.unshift({ id: 'p-' + Date.now() + '-' + importedCount, ...payload });
              } else if (db) {
                await addDoc(collection(db, 'pinjaman'), { ...payload, createdAt: serverTimestamp() });
              }
              importedCount++;
            }
            await recordActivityLog(`Import Excel: ${importedCount} transaksi pinjaman ditambahkan`);
          }

          state.modal = null;
          showToast(`Berhasil mengimpor ${importedCount} baris data dari Excel!`);
          render();
        } catch (err) {
          console.error('Import Excel Error:', err);
          showToast('Gagal membaca file Excel. Pastikan menggunakan format .xlsx/.xls yang valid.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // KALKULASI STATISTIK & GRAFIK DASHBOARD
    // =========================================================================
    function getDashboardStats() {
      const totalUnitBarang = state.barang.reduce((acc, b) => acc + (Number(b.jumlah) || 0), 0);
      const totalRuangan = state.ruangan.length;
      const totalPinjamanAktif = state.pinjaman.filter(p => p.status === 'Dipinjam').reduce((acc, p) => acc + (Number(p.jumlah) || 0), 0);
      const totalTransaksiPinjam = state.pinjaman.length;
      const totalSumber = state.sumber.length;

      // Kondisi Barang
      const kondisiCounts = {
        'Baik': 0,
        'Rusak Ringan': 0,
        'Rusak Menengah': 0,
        'Rusak Berat': 0
      };
      state.barang.forEach(b => {
        const k = b.kondisi || 'Baik';
        const jml = Number(b.jumlah) || 0;
        if (kondisiCounts[k] !== undefined) {
          kondisiCounts[k] += jml;
        } else {
          kondisiCounts['Baik'] += jml;
        }
      });

      const tersedia = Math.max(0, totalUnitBarang - totalPinjamanAktif);
      const persenTersedia = totalUnitBarang > 0 ? Math.round((tersedia / totalUnitBarang) * 100) : 100;
      const persenDipinjam = totalUnitBarang > 0 ? Math.max(0, 100 - persenTersedia) : 0;

      return {
        totalUnitBarang,
        totalRuangan,
        totalTransaksiPinjam,
        totalPinjamanAktif,
        totalSumber,
        kondisiCounts,
        persenTersedia,
        persenDipinjam
      };
    }

    // =========================================================================
    // VIEW 2: DATA BARANG
    // =========================================================================
    function renderBarangView() {
      const filtered = state.barang.filter(item => {
        const matchSearch = (item.namaBarang || '').toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                            (item.kodeBarang || '').toLowerCase().includes(state.searchQuery.toLowerCase());
        const matchKondisi = state.filterKondisi === 'all' || item.kondisi === state.filterKondisi;
        const matchRuang = state.filterRuangan === 'all' || item.ruanganId === state.filterRuangan;
        return matchSearch && matchKondisi && matchRuang;
      });

      const badgeKondisi = (k) => {
        if (k === 'Baik') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
        if (k === 'Rusak Ringan') return 'bg-amber-100 text-amber-700 border-amber-200';
        if (k === 'Rusak Menengah') return 'bg-orange-100 text-orange-700 border-orange-200';
        return 'bg-rose-100 text-rose-700 border-rose-200';

      return `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200/70 p-5">
          <!-- Header & Action -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">

                <span>Cetak Semua Label</span>

                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                <span>Export Excel</span>
              </button>
              <button type="button" data-action="open-modal" data-modal-type="import-excel" data-modul="barang"
                class="px-3 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 text-xs font-semibold flex items-center gap-1.5 transition-colors">

                <span>Import Excel</span>

              <option value="Rusak Ringan" ${state.filterKondisi === 'Rusak Ringan' ? 'selected' : ''}>Rusak Ringan</option>
              <option value="Rusak Menengah" ${state.filterKondisi === 'Rusak Menengah' ? 'selected' : ''}>Rusak Menengah</option>

    // =========================================================================
    // KOMPONEN UI: MODAL FORM, DIALOG KONFIRMASI & CETAK LABEL BARANG
    // =========================================================================
    function renderModal() {
      if (!state.modal) return '';
      const { type, mode, data, col, id, label } = state.modal;

      let title = '';
      let bodyHtml = '';
      let maxWidthClass = 'max-w-lg';
      let isLabelModal = false;

      if (type === 'cetak-label') {
        isLabelModal = true;
        maxWidthClass = 'max-w-4xl';
        const labelMode = state.modal.labelMode || 'single';
        const paperSize = state.modal.paperSize || 'A4';
        const targetItem = data || state.barang[0] || null;
        const qtyPerItem = Math.max(1, Math.min(100, Number(state.modal.labelQty) || (labelMode === 'single' && targetItem ? Math.min(Number(targetItem.jumlah) || 1, 12) : 1)));

        let itemsToRender = [];
        if (labelMode === 'single' && targetItem) {
          for (let i = 1; i <= qtyPerItem; i++) {
            itemsToRender.push({ ...targetItem, copyNo: i, totalCopy: qtyPerItem });
          }
        } else if (labelMode === 'all') {
          state.barang.forEach(b => {
            itemsToRender.push({ ...b, copyNo: 1, totalCopy: 1 });
          });
        }

        title = labelMode === 'single' && targetItem
          ? `Cetak Label Barang: ${escapeHtml(targetItem.namaBarang)}`
          : 'Cetak Semua Label Inventaris Barang';

        const logoHtml = state.identitas.logoUrl
          ? `<img src="${escapeHtml(state.identitas.logoUrl)}" alt="Logo" class="w-10 h-10 object-contain shrink-0" />`
          : `<div class="w-10 h-10 rounded-lg bg-[#333A7B] text-white flex flex-col items-center justify-center shrink-0 border border-slate-300">
               <span class="text-[10px] font-extrabold leading-none tracking-tighter">INV</span>
               <span class="text-[7px] font-semibold text-amber-300 mt-0.5">ASET</span>
             </div>`;

        bodyHtml = `
          <div class="space-y-4">
            <!-- Kontrol Pengaturan Label (Disembunyikan saat Print) -->
            <div class="no-print flex flex-wrap items-center justify-between gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
              <div class="flex flex-wrap items-center gap-3">
                <label class="flex items-center gap-2 font-semibold text-slate-700">

            <div>
              <label class="block font-semibold text-slate-700 mb-1">Jabatan / Bagian</label>
              <input type="text" name="jabatan" placeholder="Contoh: Staf Laboratorium" value="${escapeHtml(item.jabatan || '')}"
                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl" />
            </div>
            <div class="pt-3 flex justify-end gap-2">
              <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold">Batal</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-[#0284C7] text-white font-semibold">Simpan Akun</button>
            </div>
          </form>
        `;
      }

      return `
        <div id="${isLabelModal ? 'label-modal-overlay' : 'app-modal-overlay'}" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
          <div id="${isLabelModal ? 'label-modal-box' : 'app-modal-box'}" class="w-full ${maxWidthClass} bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="px-5 py-3.5 bg-[#333A7B] text-white flex items-center justify-between no-print">
              <h3 class="text-sm font-bold">${title}</h3>
              <button type="button" data-action="close-modal" class="p-1 rounded-lg hover:bg-white/15">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="p-5">
              ${bodyHtml}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // MAIN RENDER FUNCTION
    // =========================================================================
    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const toastHtml = state.toast ? `
        <div class="fixed top-4 right-4 z-[999999] px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white flex items-center gap-2 no-print ${
          state.toast.type === 'error' ? 'bg-rose-600' : state.toast.type === 'info' ? 'bg-slate-800' : 'bg-emerald-600'
        }">
          <i data-lucide="${state.toast.type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4"></i>
          <span>${escapeHtml(state.toast.message)}</span>
        </div>
      ` : '';

      if (!state.currentUser) {
        root.innerHTML = toastHtml + renderLoginView();
        lucide.createIcons();
        return;
      }

      let activeContent = '';
      switch (state.activeMenu) {
        case 'dashboard': activeContent = renderDashboardView(); break;
        case 'barang': activeContent = renderBarangView(); break;
        case 'pinjaman': activeContent = renderPinjamanView(); break;
        case 'ruangan': activeContent = renderRuanganView(); break;
        case 'sumber': activeContent = renderSumberView(); break;
        case 'pengaturan': activeContent = renderPengaturanView(); break;
        default: activeContent = renderDashboardView();
      }

      root.innerHTML = `
        ${toastHtml}
        ${renderNavigation()}
        <main class="main-workspace p-4 sm:p-6 max-w-[1440px]">
          ${renderTopHeader()}
          ${activeContent}
        </main>
        ${renderModal()}
      `;

      lucide.createIcons();
      renderCharts();
    }

    // =========================================================================
    // EVENT DELEGATION (KLIK, INPUT, & SUBMIT FORM)
    // =========================================================================
    const rootEl = document.getElementById('app-root');

    rootEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'switch-login-tab') {
        state.loginTab = btn.dataset.tab;
        render();
      } else if (action === 'nav') {
        state.activeMenu = btn.dataset.menu;
        state.searchQuery = '';
        render();
      } else if (action === 'logout') {
        handleLogout();
      } else if (action === 'print') {
        window.print();
      } else if (action === 'print-labels') {
        triggerPrintLabels();
      } else if (action === 'close-modal') {
        state.modal = null;
        render();
      } else if (action === 'open-modal') {
        const modalType = btn.dataset.modalType;
        const mode = btn.dataset.mode || 'add';
        const id = btn.dataset.id || null;
        const modul = btn.dataset.modul || null;
        const labelMode = btn.dataset.labelMode || 'single';
        let data = null;

        if (modalType === 'cetak-label' && labelMode === 'single' && id) {
          data = state.barang.find(item => item.id === id) || null;
        } else if (mode === 'edit' && id && state[modalType]) {
          data = state[modalType].find(item => item.id === id) || null;
        }

        state.modal = { type: modalType, mode, data, modul, labelMode, paperSize: 'A4' };
        render();
      } else if (action === 'export-excel') {
        exportToExcel(btn.dataset.modul);
      } else if (action === 'download-template') {
        downloadTemplateExcel(btn.dataset.modul);
      } else if (action === 'confirm-delete') {
        state.modal = {
          type: 'confirm-delete',
          col: btn.dataset.col,
          id: btn.dataset.id,
          label: btn.dataset.label
        };
        render();
      } else if (action === 'execute-delete') {
        deleteData(btn.dataset.col, btn.dataset.id, btn.dataset.label);
      } else if (action === 'toggle-pinjam') {
        toggleStatusPinjaman(btn.dataset.id);
      }
    });

    rootEl.addEventListener('input', (e) => {
      if (e.target.id === 'input-search-barang') {
        state.searchQuery = e.target.value;
        render();
        const inp = document.getElementById('input-search-barang');
        if (inp) {
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        }
      } else if (e.target.id === 'input-label-qty' && state.modal) {
        state.modal.labelQty = e.target.value;
        render();
        const qtyInp = document.getElementById('input-label-qty');
        if (qtyInp) {
          qtyInp.focus();
          qtyInp.setSelectionRange(qtyInp.value.length, qtyInp.value.length);
        }
      }
    });

    rootEl.addEventListener('change', (e) => {
      if (e.target.id === 'select-filter-kondisi') {
        state.filterKondisi = e.target.value;
        render();
      } else if (e.target.id === 'select-filter-ruangan') {
        state.filterRuangan = e.target.value;
        render();
      } else if (e.target.id === 'select-label-paper' && state.modal) {
        state.modal.paperSize = e.target.value;
        render();
      } else if (e.target.id === 'input-import-excel') {
        const file = e.target.files && e.target.files[0];
        if (file) handleImportExcelFile(file, e.target.dataset.modul);
      }
    });

    rootEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);

      if (form.id === 'form-login-admin') {
        await handleLoginAdmin(fd.get('email'), fd.get('password'));
      } else if (form.id === 'form-login-user') {
        await handleLoginUser(fd.get('username'), fd.get('password'));
      } else if (form.id === 'form-identitas') {
        await saveData('identitas', {
          namaSekolah: fd.get('namaSekolah'),
          jenjang: fd.get('jenjang'),
          tahunPelajaran: fd.get('tahunPelajaran'),
          kepalaSekolah: fd.get('kepalaSekolah'),
          logoUrl: fd.get('logoUrl')
        });
      } else if (form.id === 'form-modal-barang') {
        const ruanganObj = state.ruangan.find(r => r.id === fd.get('ruanganId'));
        const sumberObj = state.sumber.find(s => s.id === fd.get('sumberId'));
        const docId = form.dataset.mode === 'edit' ? form.dataset.id : null;
        const existingItem = docId ? state.barang.find(b => b.id === docId) : null;

        let bastUrl = (fd.get('bastUrl') || '').trim();
        let bastNama = bastUrl ? 'Link Google Drive BAST' : (existingItem?.bastNama || '');
        if (!bastUrl && existingItem?.bastUrl?.startsWith('data:')) {
          bastUrl = existingItem.bastUrl;
        }

        const bastFile = fd.get('bastFile');
        if (bastFile && bastFile.size > 0) {
          if (bastFile.size > 700 * 1024) {
            showToast('Ukuran file BAST maksimal 700KB untuk upload langsung. Gunakan Link Google Drive untuk file besar.', 'error');
            return;
          }
          bastUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(bastFile);
          });
          bastNama = bastFile.name;
        }

        await saveData('barang', {
          kodeBarang: fd.get('kodeBarang'),
          namaBarang: fd.get('namaBarang'),
          ruanganId: fd.get('ruanganId'),
          namaRuangan: ruanganObj ? ruanganObj.namaRuang : '-',
          sumberId: fd.get('sumberId'),
          namaSumber: sumberObj ? sumberObj.namaSumber : '-',
          jumlah: Number(fd.get('jumlah')) || 1,
          kondisi: fd.get('kondisi'),
          tahunPerolehan: fd.get('tahunPerolehan'),
          bastUrl,
          bastNama,
          keterangan: fd.get('keterangan')
        }, docId);
      } else if (form.id === 'form-modal-pinjaman') {
        const barangObj = state.barang.find(b => b.id === fd.get('barangId'));
        await saveData('pinjaman', {
          kodePinjam: fd.get('kodePinjam'),
          peminjam: fd.get('peminjam'),
          barangId: fd.get('barangId'),
          namaBarang: barangObj ? barangObj.namaBarang : '-',
          jumlah: Number(fd.get('jumlah')) || 1,
          tglPinjam: fd.get('tglPinjam'),
          tglKembali: fd.get('tglKembali'),
          status: 'Dipinjam',
          catatan: fd.get('catatan')
        });
      } else if (form.id === 'form-modal-ruangan') {
        const docId = form.dataset.mode === 'edit' ? form.dataset.id : null;
        await saveData('ruangan', {
          kodeRuang: fd.get('kodeRuang'),
          namaRuang: fd.get('namaRuang'),
          penanggungJawab: fd.get('penanggungJawab'),
          keterangan: fd.get('keterangan')
        }, docId);
      } else if (form.id === 'form-modal-sumber') {
        const docId = form.dataset.mode === 'edit' ? form.dataset.id : null;
        await saveData('sumber', {
          kodeSumber: fd.get('kodeSumber'),
          namaSumber: fd.get('namaSumber'),
          keterangan: fd.get('keterangan')
        }, docId);
      } else if (form.id === 'form-modal-users') {
        const docId = form.dataset.mode === 'edit' ? form.dataset.id : null;
        await saveData('users', {
          namaLengkap: fd.get('namaLengkap'),
          username: fd.get('username').trim(),
          password: fd.get('password'),
          jabatan: fd.get('jabatan'),
          role: 'user'
        }, docId);
      }
    });

    // Render Awal
    render();
  </script>
</body>
</html>
